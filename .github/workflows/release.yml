name: release

# Publishes to npm when a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) is pushed.
# Uses npm trusted publishing: GitHub proves who is publishing, so no npm token is stored anywhere.
# Pre-releases go to the `next` dist-tag, everything else to `latest`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --access public --tag "$dist_tag"
